# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Run three times a day (06:00, 12:00, 18:00 UTC) to pick up content changes
  schedule:
    - cron: '0 6,12,18 * * *'

  pull_request:
    branches: ['main']

  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          # `.next/cache` holds both the compiler cache and the fetch data
          # cache, and the data cache is only worth having if it is written
          # back. actions/cache skips the save step on an exact key hit, so a
          # key that matches on the 6-hourly cron would throw away every
          # response the run just refreshed. The run id never repeats, so each
          # run misses, restores the newest cache through restore-keys, and
          # saves its own on the way out.
          #
          # The source hash that used to be here ran after `pnpm install`, so
          # `**/*.[jt]s` matched ~90,000 files in node_modules to distinguish
          # the 59 that are ours. It cost a full tree walk to express something
          # the lockfile hash already covers, and the compiler validates its own
          # entries regardless of the key.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          # The optimizer skips images whose generated files already exist, so
          # the key has to cover more than the source images:
          #   - next.config.js sets the widths to generate, so a restored cache
          #     would otherwise keep serving variants at the old widths.
          #   - remoteOptimizedImages.js decides which remote headshots are
          #     fetched at all.
          # `remoteImagesForOptimization` is the download cache for those
          # headshots; without it every build re-downloads all 33.
          path: |
            public/**/nextImageExportOptimizer
            remoteImagesForOptimization
          key: ${{ runner.os }}-nextimages-${{ hashFiles('public/static/images/**', 'next.config.js', 'remoteOptimizedImages.js') }}
          restore-keys: |
            ${{ runner.os }}-nextimages-
      - name: Build with Next.js
        run: |
          pnpm run export
          find ./out | sed -e "s/[^-][^\/]*\//  |/g" -e "s/|\([^ ]\)/|-\1/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request' && github.ref =='refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
